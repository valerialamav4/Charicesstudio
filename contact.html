<main>
  <section class="container contact"><div class="row g-4">
    <div class="col-md-4"><div class="info-card">

      <p><b><i>Contact me:</i></b><br>

    <div class="col-md-8"><form class="form" action="#" method="post"><div class="row g-3">

      <div class="col-md-6"><input class="form-control" type="email" name="email" placeholder="Email" aria-label="Email" required></div>
      <div class="col-md-6"><input class="form-control" type="tel" name="phone" placeholder="Phone number" aria-label="Phone number"></div>
      <div class="col-12"><input class="form-control" type="text" name="subject" placeholder="Subject" aria-label="Subject"></div>
      <div class="col-12"><textarea class="form-control" name="message" placeholder="…" aria-label="Message" required></textarea></div>
